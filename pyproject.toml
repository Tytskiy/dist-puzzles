[project]
name = "dist-puzzles"
version = "0.1.0"
description = "Learn distributed training on top of flock — tensors, collectives, and parallelisms"
readme = "README.md"
authors = [
    { name = "Vladislav Tytskiy", email = "vladtytskiy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flock",
    "numpy>=2.0",
    "torch>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
flock = { path = "../flock", editable = true }
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
